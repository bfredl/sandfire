[package]
name = "sandfire"
version = "0.1.0"
edition = "2024"

# Standalone app: declare its own (empty) workspace so it doesn't get pulled
# into a surrounding workspace.
[workspace]

[[bin]]
name = "sandfire"
test = false

[dependencies]
deluge = { package = "deluge-sdk", path = "../crates/deluge-sdk", features = ["usb-log", "usb-upload"] }
# The SDK owns the async executor (selected per-target), so apps depend only on
# `deluge` for it. embassy-time is used directly for `Timer`.
embassy-time = { version = "0.5", features = ["tick-hz-1_000_000"] }
embassy-usb = "0.6.0"
embassy-futures = "0.1.2"
deluge-image = { path = "../crates/deluge-image" }
rza1-hal = { path = "../rza1/rza1-hal", features = ["rza1l"] }
cortex-ar = "0.3"
## can delenda all feats??
deluge-bsp = { path = "..//crates/deluge-bsp", features = ["usb-msc", "zero-init-below-image"] }

log = "0.4"

[features]
default = []
## Opt-in RTT (SEGGER) logging over a debug probe; off by default (reserves no RAM).
rtt = ["deluge/rtt"]
## Desktop simulator backend; `cargo deluge sim` enables it.
sim = ["deluge/sim"]
## Native Linux backend; build with `cargo deluge linux --features linux`.
linux = ["deluge/linux"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
debug = true
